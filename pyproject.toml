[project]
name = "manifest-builder"
dynamic = ["version"]
description = "Generate materialized Kubernetes manifests from configuration input"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "click",
    "pyyaml",
    "pystache",
    "dulwich>=1.2.4",
]

[project.scripts]
manifest-builder = "manifest_builder.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "simple503",
    "hypothesis>=6.170.5",
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "manifest_builder._fastyaml"

[tool.uv]
# uv only rebuilds the project when one of these changes, so the Rust sources
# have to be listed for an edit to them to reach `uv run`.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/Cargo.lock" },
    { file = "rust/src/**/*.rs" },
]

[tool.ruff.lint]
# Config blocks report malformed user configuration consistently as ValueError.
ignore = ["TRY004"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy/"
default = true
