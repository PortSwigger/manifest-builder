env:
  - name: SERVER_PORT
    value: "8443"
  - name: SERVER_HTTP2_TLS
    value: "true"
  - name: SERVER_HTTP2_TLS_CERT
    value: /tls/tls.crt
  - name: SERVER_HTTP2_TLS_KEY
    value: /tls/tls.key
name: web
image: {{static_web_server_image}}
ports:
  - containerPort: 8443
    name: https
    protocol: TCP
volumeMounts:
  - mountPath: /public
    name: public
    readOnly: true
  - mountPath: /tls
    name: tls
    readOnly: true
