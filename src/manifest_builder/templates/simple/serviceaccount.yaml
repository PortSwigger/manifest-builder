{{#service_account}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{name}}
{{#service_account_has_annotations}}
  annotations:
{{#iam_role}}
    eks.amazonaws.com/role-arn: {{iam_role}}
{{/iam_role}}
{{#service_account_annotations}}
    {{key}}: {{{value}}}
{{/service_account_annotations}}
{{/service_account_has_annotations}}
{{/service_account}}
