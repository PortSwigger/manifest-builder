apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{k8s_name}}
  labels:
    app: {{k8s_name}}
spec:
  replicas: {{replicas}}
  selector:
    matchLabels:
      app: {{k8s_name}}
  template:
    metadata:
      labels:
        app: {{k8s_name}}
    spec:
{{#service_account}}
      serviceAccountName: {{name}}
{{/service_account}}
{{#arch}}
      nodeSelector:
        kubernetes.io/arch: {{.}}
{{/arch}}
      containers:
        - name: {{k8s_name}}
          image: {{image}}
          ports:
            - name: http
              containerPort: 8080
{{#container_args}}
          args:
{{#items}}
            - {{{yaml}}}
{{/items}}
{{/container_args}}
