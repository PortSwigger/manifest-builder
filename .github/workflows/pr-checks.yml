name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Optimised builds of the extension are for the wheels; tests only need one.
      MATURIN_PEP517_ARGS: --profile dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run pytest
        run: uv run --locked --group dev pytest

      - name: Run ruff check
        run: uv run --locked --group dev ruff check

      - name: Run ruff format --check
        run: uv run --locked --group dev ruff format --check

      - name: Run ty check
        run: uv run --locked --group dev ty check

      - name: Run cargo fmt --check
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Run cargo clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

  wheels:
    uses: ./.github/workflows/wheels.yml
